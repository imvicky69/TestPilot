[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-exam-solver"
version = "1.0.0"
description = "Automated Exam Question Solver & Live Telemetry Dashboard via Chrome CDP and Gemini Multimodal Vision AI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gemini Exam Solver Team" }
]
keywords = [
    "exam-solver",
    "chrome-cdp",
    "playwright",
    "gemini-vision",
    "automation",
    "fastapi",
    "physicswallah"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "playwright>=1.40.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "rich>=13.7.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pyinstaller>=6.3.0",
    "build>=1.0.0",
    "wheel>=0.42.0",
]

[project.scripts]
exam-solver = "main:main"
exam-dashboard = "dashboard:main"
exam-gui = "gui:main"

[tool.setuptools]
py-modules = [
    "main",
    "dashboard",
    "gui",
    "test_automation",
    "chrome_connector",
    "dom_inspector",
    "image_analyzer",
    "accessibility_inspector",
    "report_generator",
    "demo_server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
